[project]
name = "finance"
version = "0.1.0"
description = "Backend for the personal finance dashboard: Enable Banking integration, categorization and statistics."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
finance = "finance.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
